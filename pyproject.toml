[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual_bicycle_pacejka"
version = "1.0.0"
description = "A simulated race car on real circuits (single-track Pacejka plant, circuit geometry, Gymnasium environment) for model-free reinforcement learning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=1.0,<1.3",
    "torch>=2.3",
    "stable-baselines3>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
reference = ["casadi>=3.6"]  # minimum-time lap reference (evaluation only)

[tool.setuptools.packages.find]
where = ["src"]
include = ["contextual_bicycle_pacejka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
