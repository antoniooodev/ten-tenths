[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual_bicycle_pacejka"
version = "1.0.0"
description = "Learning-based lap completion for a simulated race car: vehicle plant, track preparation, scripted teacher, safety filter, perturbed demonstrations, behaviour cloning and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=1.0,<1.3",
    "torch>=2.3",
    # The shipped policy archives were saved with stable-baselines3 2.8.0.
    "stable-baselines3>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["contextual_bicycle_pacejka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-lap or multi-episode regression tests (minutes)",
    "datasets: tests that need the training datasets in datasets/",
]
